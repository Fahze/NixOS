# Recipients of secrets/*.yaml.
# - fahze: personal age key (private key lives in ~/.config/sops/age/keys.txt, never in git)
# - thinkpad-fahze: age key derived from the machine SSH host key; added at install time,
#   see docs/INSTALL.md ("Secrets bootstrap").
keys:
  - &fahze age15tmed4vegh6lf65zdw5ylh742tgsj6kk4shtwsmp3cgtalw36qlsx9xg6n
  - &thinkpad-fahze age15vw94l8lmduk6e54qxnv2srt03edmu52ha8x5rejl9dru82ync2q2y4zas

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *fahze
          - *thinkpad-fahze
